<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============ BASIC SEO ============ -->
  <title>Sachin</title>
  <meta name="description" content="Sachin — software engineer & researcher." />

  <!-- ============ OPEN GRAPH ============ -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sachin" />
  <meta property="og:description" content="Software engineer & researcher." />
  <meta property="og:url" content="https://nofinsachin.github.io" />
  <meta name="twitter:card" content="summary" />

  <!-- ============ INLINE SVG FAVICON (owner's initials) ============ -->
  <link rel="icon" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <rect width='100' height='100' rx='16' fill='%23000000'/>
      <text x='50' y='50' font-family='monospace' font-size='44'
        fill='%23EDEDED' text-anchor='middle' dominant-baseline='central'>S</text>
    </svg>" />

  <!-- ============ TERMINAL FONT (only external dependency) ============ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Site styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Shared atmosphere: the flowing letters & numbers (fixed, all spreads). -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Top tabs — transparent, blends into the night background. -->
  <nav class="tabs" aria-label="Primary">
    <a class="tab is-active" href="#" data-tab="home" aria-current="true">Home</a>
    <a class="tab" href="#" data-tab="projects">Projects</a>
    <a class="tab" href="#" data-tab="research">Research</a>
  </nav>

  <!-- ============================================================
       VIEWS — one per top tab. Only the active view is shown;
       routing lives in script.js (section 2b). The Home view holds
       the original scroll-snapping book.
       ============================================================ -->

  <!-- ===== HOME VIEW — the scroll-snapping book of spreads ===== -->
  <main class="view is-active" id="view-home" data-view="home">
  <div class="book" id="book">

    <!-- ===== SPREAD 1 — Experience (hourglass) ===== -->
    <section class="spread" id="spread-experience" data-spread="hourglass" aria-label="Experience">
      <canvas class="spread__canvas" aria-hidden="true"></canvas>
      <div class="spread__spine" aria-hidden="true"></div>
      <div class="page--right">
        <p class="aspect__eyebrow"></p>
        <h1 class="aspect__line"></h1>
      </div>
      <div class="scroll-cue">Scroll<span aria-hidden="true">↓</span></div>
    </section>

    <!-- ===== SPREAD 2 — DevOps & Platform Engineering (shimmer polyhedron) ===== -->
    <section class="spread" id="spread-devops" data-spread="shimmer" aria-label="DevOps and Platform Engineering">
      <!-- Left-page 3D scene: a slowly spinning, shimmering polyhedron.
           Adapted from shimmer.css. Purely decorative. -->
      <div class="shimmer-stage" aria-hidden="true">
        <div class="scene">
          <div class="pivot">
            <div class="starHedron">
              <div class="pentagon lid"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon lid"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
              <div class="pentagon side"><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span><span class="triangle"></span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="spread__spine" aria-hidden="true"></div>
      <div class="page--right">
        <p class="aspect__eyebrow"></p>
        <h1 class="aspect__line"></h1>
      </div>
    </section>

    <!-- ===== SPREAD 3 — Artificial Intelligence (dots world map) ===== -->
    <section class="spread" id="spread-ai" data-spread="worldmap" aria-label="Artificial Intelligence">
      <canvas class="spread__canvas spread__canvas--interactive"></canvas>
      <div class="spread__spine" aria-hidden="true"></div>
      <div class="page--right">
        <p class="aspect__eyebrow"></p>
        <h1 class="aspect__line"></h1>
      </div>
    </section>

  </div>
  </main>

  <!-- ===== PROJECTS VIEW — a quiet grid of project cards. Each card
       is a condensed summary; full detail lives in its own repo.
       Cards are rendered from the PROJECTS constant in script.js. ===== -->
  <main class="view" id="view-projects" data-view="projects" aria-label="Projects" hidden>
    <div class="book projects-grid" id="projects-grid"></div>
  </main>

  <!-- ===== RESEARCH VIEW — numbered research topics, rendered from
       the RESEARCH constant in script.js. ===== -->
  <main class="view" id="view-research" data-view="research" aria-label="Research" hidden>
    <div class="book research-list" id="research-list"></div>
  </main>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Site script -->
  <script src="script.js"></script>
</body>
</html>
